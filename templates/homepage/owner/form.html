{% extends "homepage/owner/base.html" %}

{% block content %}
    <section class="panel narrow">
        <div class="panel-heading">
            <div>
                <p class="eyebrow">Edit content</p>
                <h1>{{ title }}</h1>
            </div>
        </div>
        <form class="owner-form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="form-grid single">
                {% for field in form %}
                    <label class="{% if field.field.widget.input_type == 'checkbox' %}checkbox-row{% endif %}">
                        <span>{{ field.label }}</span>
                        {{ field }}
                        {% if field.help_text %}
                            <small>{{ field.help_text }}</small>
                        {% endif %}
                        {{ field.errors }}
                    </label>
                {% endfor %}
            </div>
            <div class="form-actions">
                <button class="button primary" type="submit">Save</button>
                <a class="button secondary" href="{% url cancel_url %}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
